# WhatsApp webhook (ADR-036). Signed deliveries: Meta sends bursts from many addresses, so the
# limit is generous and shared, never per IP. Requests without a signature header (the GET
# verification or noise) get a strict per-IP limit, so they cannot use up the shared one. An empty
# key is not limited. The access log has no query string (verification token).
map $http_x_hub_signature_256 $whatsapp_signed_key {
    ''      '';
    default $server_name;
}
map $http_x_hub_signature_256 $whatsapp_unsigned_key {
    ''      $binary_remote_addr;
    default '';
}
limit_req_zone $whatsapp_signed_key zone=whatsapp_webhook:1m rate=100r/s;
limit_req_zone $whatsapp_unsigned_key zone=whatsapp_unsigned:10m rate=2r/s;
log_format whatsapp_webhook '$remote_addr [$time_local] "$request_method $uri" $status '
                            '$body_bytes_sent $request_time';

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name _;
    client_max_body_size 10m;
    location = /api/v1/webhooks/whatsapp {
        client_max_body_size 3m;
        limit_req zone=whatsapp_webhook burst=500 nodelay;
        limit_req zone=whatsapp_unsigned burst=10 nodelay;
        limit_req_status 503;
        access_log /var/log/nginx/access.log whatsapp_webhook;
        # The error log would print the request line, query included (verification token).
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}