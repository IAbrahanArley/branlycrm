spring:
  application:
    name: branly-crm
  datasource:
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
  flyway:
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: BRANLY_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  public-origin: ${APP_PUBLIC_ORIGIN:http://localhost:8088}
  mail:
    provider: ${MAIL_PROVIDER:local}
    local-directory: ${MAIL_LOCAL_DIRECTORY:${java.io.tmpdir}/branly-mail}
    resend-api-key: ${RESEND_API_KEY:}
    from-address: ${MAIL_FROM_ADDRESS:no-reply@example.test}
    from-name: ${MAIL_FROM_NAME:Branly CRM}
  mfa:
    # Base64 of 32 random bytes (openssl rand -base64 32). Required by the API; never logged.
    encryption-key: ${MFA_ENCRYPTION_KEY:}
logging:
  level:
    # Hibernate logs the PostgreSQL message of every JDBC failure, which may contain SQL text or
    # values. Clinic persistence logs only stable codes and SQLStates instead (ADR-030).
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
