spring:
  docker:
    compose:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: 8080
  servlet:
    context-path: /api
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never