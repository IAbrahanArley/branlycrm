name: branlycrm
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-branlycrm}
      POSTGRES_USER: ${POSTGRES_USER:-branlycrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  db-bootstrap:
    image: pgvector/pgvector:pg17
    entrypoint: ["sh", "/bootstrap/bootstrap-roles.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-branlycrm}
      POSTGRES_USER: ${POSTGRES_USER:-branlycrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      CONTROL_RUNTIME_PASSWORD: ${CONTROL_RUNTIME_PASSWORD:?Defina CONTROL_RUNTIME_PASSWORD}
      CONTROL_MIGRATION_PASSWORD: ${CONTROL_MIGRATION_PASSWORD:?Defina CONTROL_MIGRATION_PASSWORD}
      TENANT_PROVISIONER_PASSWORD: ${TENANT_PROVISIONER_PASSWORD:?Defina TENANT_PROVISIONER_PASSWORD}
      PROVISIONING_WORKER_PASSWORD: ${PROVISIONING_WORKER_PASSWORD:?Defina PROVISIONING_WORKER_PASSWORD}
      PLATFORM_OPERATOR_PASSWORD: ${PLATFORM_OPERATOR_PASSWORD:?Defina PLATFORM_OPERATOR_PASSWORD}
    volumes:
      - ./infra/postgres/bootstrap-roles.sh:/bootstrap/bootstrap-roles.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  migrate:
    image: branlycrm-backend
    build: ./backend
    environment:
      APP_MODE: migrate
      MIGRATION_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-branlycrm}
      MIGRATION_DB_USER: crm_control_migrator
      MIGRATION_DB_PASSWORD: ${CONTROL_MIGRATION_PASSWORD:?Defina CONTROL_MIGRATION_PASSWORD}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_FLYWAY_ENABLED: 'false'
      APP_TENANCY_HOST: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-branlycrm}
      SPRING_DATASOURCE_USERNAME: crm_control_runtime
      SPRING_DATASOURCE_PASSWORD: ${CONTROL_RUNTIME_PASSWORD:?Defina CONTROL_RUNTIME_PASSWORD}
      APP_TENANCY_SECRETS_DIRECTORY: /run/branly/tenant-secrets
      # ADR-021: e-mail only in the API. Locally, messages are files in the container.
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-http://localhost:8088}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-local}
      MAIL_LOCAL_DIRECTORY: /tmp/branly-mail
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.test}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Branly CRM}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      # Read-only: only the future provisioner writes clinic credentials (ADR-016).
      - tenant_secrets:/run/branly/tenant-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /api/actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n\" >&3; cat <&3 | grep -q UP'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped
  provisioner:
    image: branlycrm-backend
    build: ./backend
    environment:
      APP_MODE: provision
      SPRING_FLYWAY_ENABLED: 'false'
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-branlycrm}
      SPRING_DATASOURCE_USERNAME: crm_provisioning_worker
      SPRING_DATASOURCE_PASSWORD: ${PROVISIONING_WORKER_PASSWORD:?Defina PROVISIONING_WORKER_PASSWORD}
      APP_TENANCY_HOST: postgres
      APP_TENANCY_SECRETS_DIRECTORY: /run/branly/tenant-secrets
      APP_PROVISIONING_ADMIN_USERNAME: crm_tenant_provisioner
      APP_PROVISIONING_ADMIN_PASSWORD: ${TENANT_PROVISIONER_PASSWORD:?Defina TENANT_PROVISIONER_PASSWORD}
      APP_PROVISIONING_CONTROL_DATABASE: ${POSTGRES_DB:-branlycrm}
    volumes:
      # Only writer of clinic credentials; the API mounts the same volume read-only.
      - tenant_secrets:/run/branly/tenant-secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  # Platform command (ADR-028): run on demand, never as a server. Example:
  # docker compose --profile tools run --rm platform create-agency --request-id <uuid> --name "<nome>" --admin-email <e-mail>
  platform:
    image: branlycrm-backend
    build: ./backend
    profiles: ["tools"]
    # The invitation link must not stay in `docker logs`; the attached run still prints it.
    logging:
      driver: none
    environment:
      APP_MODE: platform
      SPRING_FLYWAY_ENABLED: 'false'
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-branlycrm}
      SPRING_DATASOURCE_USERNAME: crm_platform_operator
      SPRING_DATASOURCE_PASSWORD: ${PLATFORM_OPERATOR_PASSWORD:?Defina PLATFORM_OPERATOR_PASSWORD}
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-http://localhost:8088}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8080/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  tenant_secrets: